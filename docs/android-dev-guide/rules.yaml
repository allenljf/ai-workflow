- id: duplicated-build-config
  level: MUST
  enforce: new-only+on-touch
  owner: 02-modularization.md
  check: regex
  pattern: (?<![\w.])(?:compileSdk|minSdk|targetSdk|compileSdkVersion|minSdkVersion|targetSdkVersion|jvmTarget)\s*=|^[ \t]*(?:subprojects|allprojects)\s*\{|^[
    \t]*compileOptions\s*\{
  message: 共通建置設定（compileSdk / minSdk / targetSdk / jvmTarget / compileOptions）一律由 build-logic 的 convention plugin 提供，模組只留
    namespace 與自己的依賴；也不要用 subprojects {} / allprojects {} 統一套設定。
  applies_to:
  - '*build.gradle.kts'
  - '*build.gradle'
  exclude:
  - '*build-logic/*'
  - '*buildSrc/*'
  source: https://developer.android.com/topic/modularization/patterns
- id: hardcoded-dependency-coordinate
  level: MUST
  enforce: new-only+on-touch
  owner: 02-modularization.md
  check: regex
  pattern: (['"])[a-zA-Z][\w.-]*:[\w.-]+:[^'"\s]*\1
  message: 依賴座標與版本一律宣告在 gradle/libs.versions.toml，build script 只用 libs.* 引用（implementation(libs.androidx.core.ktx)）；不要硬寫 group:name:version、不要動態版本、不要用
    buildSrc 的 Kotlin object 管版本。
  applies_to:
  - '*build.gradle.kts'
  - '*build.gradle'
  - '*settings.gradle.kts'
  - '*buildSrc/src/*.kt'
  source: https://developer.android.com/build/migrate-to-catalogs
- id: kapt-in-new-module
  level: MUST_NOT
  enforce: new-only
  owner: 02-modularization.md
  check: regex
  pattern: \bid\s*\(\s*(['"])(?:kotlin-kapt|org\.jetbrains\.kotlin\.kapt)\1|^[ \t]*kapt\s*[\("']|\blibs\.plugins\.kapt\b|\bkotlin\s*\(\s*(['"])kapt\2
  message: 新模組的註解處理器一律用 KSP：plugins { alias(libs.plugins.ksp) } + ksp(libs.xxx.compiler)。仍不支援 KSP 的處理器要隔離在單獨模組。
  applies_to:
  - '*build.gradle.kts'
  - '*build.gradle'
  source: https://developer.android.com/build/migrate-to-ksp
