  enforce: new-only+on-touch
  owner: 03-dependency-injection.md
  check: regex
  pattern: (?<![\w.])(?:object|class)[ \t]+\w*(?:ServiceLocator|AppContainer)\b|(?<![\w.])\w*ServiceLocator[ \t]*\.
  message: 改用建構函式注入取得依賴，綁定寫在 @Module；跨模組共享的能力注入介面，不要用 object 單例持有狀態或在 domain / data 類別反查 DI 容器。
