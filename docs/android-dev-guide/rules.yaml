# Android 開發準則 — 機器可讀規則索引（唯一真相源）
# guides/*.md 是這份的人類可讀版本。改規則要同步兩邊。
#
# level:   MUST / MUST_NOT / SHOULD / SHOULD_NOT / MAY      錯得多嚴重
# enforce: new-only / new-only+on-touch / migrate / exempt   什麼時候要修
# check:   regex（需 pattern 欄位）/ file（需 file_check）/ manual / detekt:<rule>

- id: ui-accesses-datasource
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 01-architecture.md
  check: regex
  pattern: \bva[lr]\s+\w+\s*:\s*\w*(?:ApiService|ApiClient|RetrofitService|Dao|DataStore|SharedPreferences|Preferences|DataSource|Firebase(?:Firestore|Database|Auth|Storage))\b
  message: UI 層（含 ViewModel）不得直接持有 DataSource。改注入 Repository 介面；即使該資料只有單一來源，仍要建 Repository。
  applies_to:
  - '*ViewModel.kt'
  - '*Activity.kt'
  - '*Fragment.kt'
  - '*Screen.kt'
  - '*Route.kt'
  - '*Dialog.kt'
  - '*BottomSheet.kt'
  - '*Composable.kt'
  - '*Content.kt'
  exclude:
  - '**/test/**'
  - '**/androidTest/**'
  - '**/*Test.kt'
  - '**/*Tests.kt'
  source: https://developer.android.com/topic/architecture/recommendations
- id: composable-calls-data-layer
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 01-architecture.md
  check: regex
  pattern: '@Composable[\s\S]{0,240}?\bfun\s+\w+\s*\([^)]*:\s*\w*(?:Repository|UseCase|Interactor)\b|^[ \t]*(?:private\s+|internal\s+|protected\s+)?va[lr]\s+\w+\s*:\s*\w*(?:Repository|UseCase|Interactor)\s*(?:=|by\s+\w+)'
  message: Composable / Activity / Fragment 不得注入或呼叫 Repository / UseCase。改注入 ViewModel：狀態下行（collectAsStateWithLifecycle）、事件上行（viewModel.refresh()）。
  applies_to:
  - '*Activity.kt'
  - '*Fragment.kt'
  - '*Screen.kt'
  - '*Route.kt'
  - '*Dialog.kt'
  - '*BottomSheet.kt'
  - '*Composable.kt'
  - '*Content.kt'
  exclude:
  - '**/*ViewModel.kt'
  - '**/test/**'
  - '**/androidTest/**'
  - '**/*Test.kt'
  - '**/*Tests.kt'
  source: https://developer.android.com/topic/architecture/recommendations
- id: data-layer-imports-ui-type
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 01-architecture.md
  check: regex
  pattern: ^[ \t]*import\s+(?:androidx\.compose\.|androidx\.lifecycle\.(?:ViewModel|AndroidViewModel|LiveData|MutableLiveData)\b|androidx\.fragment\.|androidx\.activity\.|android\.app\.Activity\b|android\.view\.|android\.widget\.)
  message: data 層不得 import UI 型別（Compose / ViewModel / Fragment / Activity / View）。狀態留在 feature 的 ViewModel，data 層只回 Flow<DomainModel>。
  applies_to:
  - '*core/data/src/*.kt'
  - '*core/network/src/*.kt'
  - '*core/database/src/*.kt'
  - '*core/datastore/src/*.kt'
  - '*Repository.kt'
  - '*RepositoryImpl.kt'
  - '*DataSource.kt'
  - '*Dao.kt'
  - '*ApiService.kt'
  - '*Entity.kt'
  - '*Dto.kt'
  exclude:
  - '**/ui/**'
  - '**/compose/**'
  - '**/presentation/**'
  - '**/test/**'
  - '**/androidTest/**'
  - '**/*Test.kt'
  - '**/*Tests.kt'
  source: https://developer.android.com/topic/architecture/recommendations
- id: callback-type-across-layer
  level: MUST_NOT
  enforce: new-only
  owner: 01-architecture.md
  check: regex
  pattern: ^[ \t]*(?!.*\bprivate\b)(?:\w+\s+)*fun\s+\w+\s*\([^)]*\)\s*:\s*(?:Call|Single|Observable|Flowable|Completable|Maybe|LiveData|MutableLiveData)\s*<|^[
    \t]*(?!.*\bprivate\b)(?:\w+\s+)*fun\s+\w+\s*\([^)]*\b(?:callback|listener|onResult|onSuccess|onFailure|onError|onComplete)\s*:\s*(?:\(|[A-Z]\w*(?:Listener|Callback)\b)
  message: 跨層公開簽章只能是 suspend fun（一次性操作）或 Flow（需被觀察的資料）。改掉 callback / LiveData / RxJava / Call<T>；包裝無法修改的第三方 callback SDK 時，在
    DataSource 內用 callbackFlow 收斂，callback 不得外流。
  applies_to:
  - '*core/data/src/*.kt'
  - '*core/domain/src/*.kt'
  - '*Repository.kt'
  - '*RepositoryImpl.kt'
  - '*DataSource.kt'
  - '*UseCase.kt'
  - '*Dao.kt'
  exclude:
  - '**/*ApiService.kt'
  - '**/*Api.kt'
  - '**/ui/**'
  - '**/compose/**'
  - '**/presentation/**'
  - '**/test/**'
  - '**/androidTest/**'
  - '**/*Test.kt'
  - '**/*Tests.kt'
  source: https://developer.android.com/topic/architecture/recommendations
- id: concrete-impl-dependency
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 01-architecture.md
  check: regex
  pattern: \bva[lr]\s+\w+\s*:\s*(?:\w*(?:RepositoryImpl|UseCaseImpl|DataSourceImpl|ServiceImpl|ManagerImpl)|Default\w*(?:Repository|UseCase|DataSource)|Offline\w*(?:Repository|DataSource))\b
  message: 建構子只宣告介面（OrderRepository），不得宣告下層具體實作（DefaultOrderRepository / *RepositoryImpl）；實作由 DI 綁定提供。Repository 實作注入自己的 DataSource
    不受此限。
  exclude:
  - '**/di/**'
  - '**/*Module.kt'
  - '**/test/**'
  - '**/androidTest/**'
  - '**/*Test.kt'
  - '**/*Tests.kt'
  source: 官方 sample nowinandroid
- id: dto-entity-in-ui-layer
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 01-architecture.md
  check: manual
  source: https://developer.android.com/topic/architecture/data-layer
- id: dto-entity-same-class
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 01-architecture.md
  check: regex
  pattern: '@(?:Entity|PrimaryKey|ColumnInfo)(?:\s*\([^)]*\))?\s*(?:@\w+(?:\([^)]*\))?\s*)*@(?:Serializable|SerialName|SerializedName)\b|@(?:Serializable|SerialName|SerializedName)(?:\s*\([^)]*\))?\s*(?:@\w+(?:\([^)]*\))?\s*)*@(?:Entity|PrimaryKey|ColumnInfo)\b'
  message: 同一型別不得同時帶序列化註解與持久化註解。拆成 NetworkOrder（@Serializable）與 OrderEntity（@Entity）兩個型別，中間用 asEntity() 轉換，API 欄位改名才不會連動 DB
    migration。
  exclude:
  - '**/test/**'
  - '**/androidTest/**'
  - '**/*Test.kt'
  - '**/*Tests.kt'
  source: https://developer.android.com/topic/architecture/data-layer/offline-first
- id: business-logic-in-mapper
  level: SHOULD_NOT
  enforce: new-only
  owner: 01-architecture.md
  check: manual
  source: 業界共識
- id: app-component-as-data-holder
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 01-architecture.md
  check: regex
  pattern: companion\s+object\s*\{[^{}]{0,400}?\bvar\s+\w+\s*[:=]
  message: 不得用 Activity / Fragment / Service / Application 的 companion 可變欄位保存或傳遞資料（行程被重建後會是 null）。導航只傳 id，目的地自行從 Repository
    讀取；真正的常數用 const val。
  applies_to:
  - '*Activity.kt'
  - '*Fragment.kt'
  - '*Service.kt'
  - '*Application.kt'
  - '*App.kt'
  exclude:
  - '**/test/**'
  - '**/androidTest/**'
  - '**/*Test.kt'
  - '**/*Tests.kt'
  source: https://developer.android.com/topic/architecture/recommendations
- id: uncategorized-module-path
  level: MUST
  enforce: new-only
  owner: 02-modularization.md
  check: regex
  pattern: ^[ \t]*include\s*\(?\s*(['"])(?!:app\1):[A-Za-z0-9._-]+\1
  message: 模組路徑要帶類別前綴：include(":feature:search") / include(":core:common")，不要有無前綴的頂層模組（:app 例外）。
  applies_to:
  - settings.gradle.kts
  - '*settings.gradle.kts'
  - settings.gradle
  - '*settings.gradle'
  exclude:
  - '*build-logic/*'
  - '*buildSrc/*'
  source: '官方 sample nowinandroid: https://github.com/android/nowinandroid/blob/main/settings.gradle.kts'
- id: cross-feature-module-dependency
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 02-modularization.md
  check: regex
  pattern: ^[ \t]*(?:implementation|api|compileOnly|runtimeOnly)\s*\(?\s*project\s*\(\s*(['"]):feature:[A-Za-z0-9._-]+\1\s*\)
  message: feature 模組不得依賴另一個 feature 模組。跨 feature 跳轉改依賴對方的契約模組（:feature:order:api），共用程式碼下推到 :core:*。
  applies_to:
  - '*feature/*/build.gradle.kts'
  - '*feature/*/build.gradle'
  source: '官方 sample nowinandroid: https://github.com/android/nowinandroid/blob/main/docs/ModularizationLearningJourney.md'
- id: cross-feature-class-import
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 02-modularization.md
  check: regex
  pattern: \bIntent\s*\(\s*[\w.()]+\s*,\s*[A-Z]\w*Activity\s*::\s*class\s*\.\s*java
  message: 不得用 Intent(context, XxxActivity::class.java) 直接跳轉。改走契約模組公開的 route 或介面，例如 navController.navigate(OrderDetailRoute(orderId
    = id))。
  applies_to:
  - '*feature/*/src/*.kt'
  - '*features/*/src/*.kt'
  exclude:
  - '**/*Activity.kt'
  - '**/test/**'
  - '**/androidTest/**'
  - '**/*Test.kt'
  - '**/*Tests.kt'
  source: https://developer.android.com/topic/modularization/patterns
- id: core-depends-on-feature
  level: MUST_NOT
  enforce: new-only
  owner: 02-modularization.md
  check: regex
  pattern: project\s*\(\s*(['"]):(?:feature|app)\b[^'"]*\1
  message: 依賴方向只能 :app → :feature:* → :core:*。core / data / domain 模組要用的型別下推到 :core:model 或 :core:common，不要反向依賴 feature 或
    app。
  applies_to:
  - '*core/*/build.gradle.kts'
  - '*core/*/build.gradle'
  - '*data/*/build.gradle.kts'
  - '*data/*/build.gradle'
  - '*domain/*/build.gradle.kts'
  - '*domain/*/build.gradle'
  exclude:
  - '*build-logic/*'
  - '*buildSrc/*'
  source: '官方 sample nowinandroid: https://github.com/android/nowinandroid/blob/main/docs/ModularizationLearningJourney.md'
