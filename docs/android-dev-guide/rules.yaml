- id: private-inject-field
  level: MUST_NOT
  enforce: new-only
  owner: 03-dependency-injection.md
  check: regex
  pattern: '@Inject[ \t\r\n]+(?:@[\w.:]+(?:\([^)]*\))?[ \t\r\n]+)*private[ \t]+(?:lateinit[ \t]+)?va[lr]\b'
  message: 把 @Inject 欄位的 private 改成 internal 或 public —— Hilt 無法注入 private 欄位（建構函式參數的 private val 不受此限）。
  source: https://developer.android.com/training/dependency-injection/hilt-android
- id: module-without-install-in
  level: MUST
  enforce: new-only+on-touch
  owner: 03-dependency-injection.md
  check: regex
  pattern: (?<![)\w]\n)^[ \t]*@Module\b(?:[ \t]*\([^)]*\))?[ \t]*(?:\n[ \t]*)?(?:@(?!InstallIn)\w+(?:\([^)]*\))?[ \t]*(?:\n[
    \t]*)?)*(?:(?:internal|public|abstract|open)[ \t]+)*(?:object|class|interface)[ \t]+\w+(?=[\s\S]{0,4000}?@(?:Provides|Binds|Multibinds)\b)
  message: 含 @Provides / @Binds 的 @Module 要同時標註 @InstallIn(<Component>::class) 指定安裝位置；dynamic feature 模組改用 @EntryPoint。
  exclude:
  - '**/src/test/**'
  - '**/src/androidTest/**'
  - '**/*Test.kt'
  source: https://developer.android.com/training/dependency-injection/hilt-multi-module
