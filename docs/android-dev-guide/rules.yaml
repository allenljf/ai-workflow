- id: missing-hilt-android-app
  level: MUST
  enforce: migrate
  owner: 03-dependency-injection.md
  check: regex
  pattern: (?<![)\w]\n)^[ \t]*(?:(?:internal|public|final)[ \t]+)*class[ \t]+\w+[ \t]*(?:\([^)]*\))?[ \t]*:[ \t]*(?:[\w.]+[
    \t]*\([^)]*\)[ \t]*,[ \t]*)*(?:android\.app\.)?Application[ \t]*\(
  message: 'Application 子類別要標註 @HiltAndroidApp 並在 AndroidManifest 的 android:name 註冊；非 Hilt 專案本條不適用（見 guides/03 第四節），可加 //
    guide-ignore: missing-hilt-android-app。'
  exclude:
  - '**/src/test/**'
  - '**/src/androidTest/**'
  - '**/*Test.kt'
  source: https://developer.android.com/training/dependency-injection/hilt-android
