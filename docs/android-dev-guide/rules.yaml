- id: missing-build-performance-flags
  level: MUST
  enforce: migrate
  owner: 02-modularization.md
  check: regex
  pattern: ^[ \t]*android\.enableJetifier\s*=\s*true|^[ \t]*(?:org\.gradle\.(?:parallel|caching|configuration-cache)|android\.nonTransitiveRClass)\s*=\s*false
  message: 移除 android.enableJetifier=true，並把 org.gradle.parallel / caching / configuration-cache / android.nonTransitiveRClass
    都設為 true（pattern 只抓得到顯式關閉與 Jetifier；四個 flag 是否齊備仍需人工確認）。
