name: Daily collection
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-state
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_URL: ${{ vars.SITE_URL || 'http://localhost:4321' }}
      SITE_BASE: ${{ vars.SITE_BASE || '/' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - name: Load durable state
        id: load
        run: |
          gh auth setup-git
          mkdir -p .build
          python scripts/state-sync.py load --checkout .build/state-git > .build/state-head.json
          python -c "import json,os; f=open(os.environ['GITHUB_OUTPUT'],'a'); f.write('head='+json.load(open('.build/state-head.json'))['head']+'\n')"
      - name: Collect without AI
        id: collect
        continue-on-error: true
        run: python -m radar.cli collect --config config --state .build/state-git/snapshot.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Persist even failed-source health
        if: always() && steps.load.outcome == 'success'
        env:
          EXPECTED_SHA: ${{ steps.load.outputs.head }}
        run: python scripts/state-sync.py persist --checkout .build/state-git --expected-sha "$EXPECTED_SHA"
      - name: Export only after persistence
        if: steps.collect.outcome == 'success'
        run: |
          python -m radar.cli export --config config --state .build/state-git/snapshot.json --output .build/export
          python scripts/build-site.py --export .build/export --site site
          npm --prefix site ci
          npm --prefix site run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.collect.outcome == 'success'
        with:
          name: radar-site
          path: site/dist
          if-no-files-found: error
          retention-days: 7
      - id: ready
        if: steps.collect.outcome == 'success'
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Report failed collection
        if: steps.collect.outcome == 'failure'
        run: exit 1
  publish:
    needs: collect
    if: needs.collect.outputs.ready == 'true' && vars.PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/publish.yml
    secrets:
      PUBLIC_EXPORT_TOKEN: ${{ secrets.PUBLIC_EXPORT_TOKEN }}
