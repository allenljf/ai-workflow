name: Export preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: gh auth setup-git
      - run: python scripts/state-sync.py load --checkout .build/state-git
      - run: python -m radar.cli export --config config --state .build/state-git/snapshot.json --output .build/export
      - run: python scripts/build-site.py --export .build/export --site site
      - run: npm --prefix site ci
      - run: npm --prefix site run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'http://localhost:4321' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: radar-preview
          path: site/dist
          retention-days: 7
