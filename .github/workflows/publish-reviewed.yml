name: Publish reviewed content
on:
  push:
    branches: [main]
    paths:
      - 'content/public/**'
      - 'site/**'
      - 'src/radar/**'
      - 'config/**'
      - 'scripts/build-site.py'
      - '.github/workflows/publish-reviewed.yml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-state
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      AI_ENABLED: ${{ vars.AI_ENABLED || 'false' }}
      AI_INTERVAL_DAYS: ${{ vars.AI_INTERVAL_DAYS || '14' }}
      KNOWLEDGE_DISCOVERY_ENABLED: ${{ vars.KNOWLEDGE_DISCOVERY_ENABLED || 'false' }}
      SITE_URL: ${{ vars.SITE_URL || 'http://localhost:4321' }}
      SITE_BASE: ${{ vars.SITE_BASE || '/' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - name: Export current state without collection or AI calls
        run: |
          gh auth setup-git
          python scripts/state-sync.py load --checkout .build/state-git
          test -f .build/state-git/snapshot.json || python -c "from radar.store import save_snapshot; from radar.models import Snapshot; from pathlib import Path; save_snapshot(Path('.build/state-git/snapshot.json'), Snapshot())"
          python -m radar.cli export --config config --state .build/state-git/snapshot.json --output .build/export
          python scripts/build-site.py --export .build/export --site site
          npm --prefix site ci
          npm --prefix site run build
          git rev-parse HEAD > site/dist/build-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: radar-site
          path: site/dist
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    if: vars.PUBLISH_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
