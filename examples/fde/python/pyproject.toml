[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "fde-local-labs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]
[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.3"]
[tool.setuptools.packages.find]
where = ["."]
include = ["fde_lab*"]
