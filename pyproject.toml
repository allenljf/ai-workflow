[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-workflow-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "feedparser>=6,<7", "PyYAML>=6,<7", "jsonschema>=4,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
radar = ["*.json"]
"radar.enrich" = ["*.json", "*.md"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
